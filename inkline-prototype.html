<title>Inkline — draw a text field</title>
<style>
  :root {
    --bg: #fbfbfd;
    --dot: #e4e4e9;
    --ink: #1d1d1f;
    --faint: #98989d;
    --guide: #c9c9ce;
    --accent: #0071e3;
    --warn: #c07a1f;
    --chrome-bg: rgba(251, 251, 253, 0.85);
    --btn-bg: rgba(29, 29, 31, 0.05);
    --btn-bg-hover: rgba(29, 29, 31, 0.1);
    --shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161617;
      --dot: #29292c;
      --ink: #f5f5f7;
      --faint: #86868b;
      --guide: #3d3d42;
      --accent: #0a84ff;
      --warn: #d9a04f;
      --chrome-bg: rgba(22, 22, 23, 0.85);
      --btn-bg: rgba(245, 245, 247, 0.08);
      --btn-bg-hover: rgba(245, 245, 247, 0.15);
      --shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
    }
  }
  :root[data-theme="light"] {
    --bg: #fbfbfd;
    --dot: #e4e4e9;
    --ink: #1d1d1f;
    --faint: #98989d;
    --guide: #c9c9ce;
    --accent: #0071e3;
    --warn: #c07a1f;
    --chrome-bg: rgba(251, 251, 253, 0.85);
    --btn-bg: rgba(29, 29, 31, 0.05);
    --btn-bg-hover: rgba(29, 29, 31, 0.1);
    --shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
  }
  :root[data-theme="dark"] {
    --bg: #161617;
    --dot: #29292c;
    --ink: #f5f5f7;
    --faint: #86868b;
    --guide: #3d3d42;
    --accent: #0a84ff;
    --warn: #d9a04f;
    --chrome-bg: rgba(22, 22, 23, 0.85);
    --btn-bg: rgba(245, 245, 247, 0.08);
    --btn-bg-hover: rgba(245, 245, 247, 0.15);
    --shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
  }

  html, body { height: 100%; }
  body {
    margin: 0;
    overflow: hidden;
    background: var(--bg);
    background-image: radial-gradient(var(--dot) 1px, transparent 1px);
    background-size: 28px 28px;
    font-family: -apple-system, "SF Pro Text", system-ui, "Segoe UI", sans-serif;
    color: var(--ink);
  }

  #stage {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    touch-action: none;
    cursor: crosshair;
  }

  /* --- top-right controls --- */
  .topbar {
    position: fixed;
    top: 16px;
    right: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .topbar button {
    font: 500 13px -apple-system, "SF Pro Text", system-ui, "Segoe UI", sans-serif;
    color: var(--ink);
    background: var(--btn-bg);
    border: none;
    border-radius: 999px;
    height: 32px;
    cursor: pointer;
    transition: background 0.15s ease;
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
  }
  .topbar button:hover { background: var(--btn-bg-hover); }
  .topbar button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #clear { padding: 0 16px; }
  #help-btn {
    width: 32px;
    font-size: 14px;
    color: var(--faint);
  }
  #help-btn:hover, #help-btn[aria-expanded="true"] { color: var(--ink); }

  .popover {
    position: fixed;
    top: 56px;
    right: 16px;
    width: 232px;
    padding: 14px 16px;
    background: var(--chrome-bg);
    -webkit-backdrop-filter: blur(16px);
    backdrop-filter: blur(16px);
    border-radius: 12px;
    box-shadow: var(--shadow);
    font-size: 13px;
    line-height: 1.55;
    color: var(--faint);
    user-select: none;
  }
  .popover[hidden] { display: none; }
  .popover strong { color: var(--ink); font-weight: 500; }

  #kbd {
    position: fixed;
    top: 0;
    left: 0;
    width: 1px;
    height: 1px;
    opacity: 0;
    border: 0;
    padding: 0;
  }

  /* --- svg layers --- */
  .preview {
    fill: none;
    stroke: var(--accent);
    stroke-width: 1.5;
    stroke-linecap: round;
    opacity: 0.5;
  }
  .guide {
    fill: none;
    stroke: var(--guide);
    stroke-width: 1.25;
    stroke-dasharray: 1 7;
    stroke-linecap: round;
  }
  g.focused .guide { stroke: var(--accent); }
  g.full .guide { stroke: var(--warn); stroke-dasharray: none; opacity: 0.7; }
  .txt {
    font: 400 28px -apple-system, "SF Pro Text", system-ui, "Segoe UI", sans-serif;
    fill: var(--ink);
    pointer-events: none;
  }
  .ph {
    font: 400 15px -apple-system, "SF Pro Text", system-ui, "Segoe UI", sans-serif;
    fill: var(--faint);
    pointer-events: none;
  }
  g:not(.focused) .ph { opacity: 0.6; }
  .hit {
    fill: none;
    stroke: transparent;
    stroke-width: 40;
    pointer-events: stroke;
    cursor: text;
  }
  .caret {
    stroke: var(--accent);
    stroke-width: 1.75;
    animation: blink 1.1s steps(2, start) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) {
    .caret { animation: none; }
  }
</style>

<svg id="stage" aria-label="Drawing surface: draw a stroke to create a curved text field"></svg>

<div class="topbar">
  <button id="clear" type="button">Clear</button>
  <button id="help-btn" type="button" aria-expanded="false" aria-controls="help">?</button>
</div>
<div class="popover" id="help" hidden>
  <strong>Draw a stroke</strong> — it becomes a text field.<br>
  Click a line to edit. Backspace on an empty line deletes it.
</div>

<input id="kbd" type="text" autocomplete="off" autocapitalize="off" spellcheck="false"
       aria-label="Curved text field input">

<script>
(() => {
  const NS = 'http://www.w3.org/2000/svg';
  const svg = document.getElementById('stage');
  const kbd = document.getElementById('kbd');
  const FONT = '400 28px -apple-system, "SF Pro Text", system-ui, "Segoe UI", sans-serif';
  const FS = 28;

  const meas = document.createElement('canvas').getContext('2d');
  meas.font = FONT;
  const widthOf = s => meas.measureText(s).width;

  const make = (tag, attrs = {}) => {
    const el = document.createElementNS(NS, tag);
    for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
    return el;
  };

  let trails = [];
  let active = null;
  let drawing = null;
  let uid = 0;

  /* ---------- help popover ---------- */

  const helpBtn = document.getElementById('help-btn');
  const help = document.getElementById('help');
  const closeHelp = () => { help.hidden = true; helpBtn.setAttribute('aria-expanded', 'false'); };
  helpBtn.addEventListener('click', () => {
    help.hidden = !help.hidden;
    helpBtn.setAttribute('aria-expanded', String(!help.hidden));
  });

  /* ---------- geometry ---------- */

  // keep points at least minDist apart
  function simplify(pts, minDist) {
    const out = [pts[0]];
    for (const p of pts) {
      const q = out[out.length - 1];
      if (Math.hypot(p.x - q.x, p.y - q.y) >= minDist) out.push(p);
    }
    if (out[out.length - 1] !== pts[pts.length - 1]) out.push(pts[pts.length - 1]);
    return out;
  }

  // one neighbour-averaging pass to damp hand jitter
  function relax(pts) {
    if (pts.length < 3) return pts;
    const out = [pts[0]];
    for (let i = 1; i < pts.length - 1; i++) {
      out.push({
        x: (pts[i - 1].x + 2 * pts[i].x + pts[i + 1].x) / 4,
        y: (pts[i - 1].y + 2 * pts[i].y + pts[i + 1].y) / 4,
      });
    }
    out.push(pts[pts.length - 1]);
    return out;
  }

  // Catmull-Rom through the points, emitted as cubic beziers
  function toPathD(p) {
    if (p.length < 2) return '';
    let d = `M${p[0].x.toFixed(1)},${p[0].y.toFixed(1)}`;
    if (p.length === 2) return d + ` L${p[1].x.toFixed(1)},${p[1].y.toFixed(1)}`;
    for (let i = 0; i < p.length - 1; i++) {
      const p0 = p[Math.max(0, i - 1)], p1 = p[i], p2 = p[i + 1], p3 = p[Math.min(p.length - 1, i + 2)];
      const c1x = p1.x + (p2.x - p0.x) / 6, c1y = p1.y + (p2.y - p0.y) / 6;
      const c2x = p2.x - (p3.x - p1.x) / 6, c2y = p2.y - (p3.y - p1.y) / 6;
      d += ` C${c1x.toFixed(1)},${c1y.toFixed(1)} ${c2x.toFixed(1)},${c2y.toFixed(1)} ${p2.x.toFixed(1)},${p2.y.toFixed(1)}`;
    }
    return d;
  }

  function polylineD(pts) {
    return pts.map((p, i) => `${i ? 'L' : 'M'}${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');
  }

  const totalLen = pts => {
    let l = 0;
    for (let i = 1; i < pts.length; i++) l += Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y);
    return l;
  };

  /* ---------- drawing new trails ---------- */

  const pt = e => ({ x: e.clientX, y: e.clientY });

  svg.addEventListener('pointerdown', e => {
    closeHelp();
    blurActive();
    svg.setPointerCapture(e.pointerId);
    drawing = { pts: [pt(e)], el: make('path', { class: 'preview' }) };
    svg.appendChild(drawing.el);
  });

  svg.addEventListener('pointermove', e => {
    if (!drawing) return;
    const p = pt(e), last = drawing.pts[drawing.pts.length - 1];
    if (Math.hypot(p.x - last.x, p.y - last.y) < 3) return;
    drawing.pts.push(p);
    drawing.el.setAttribute('d', polylineD(drawing.pts));
  });

  const endStroke = () => {
    if (!drawing) return;
    drawing.el.remove();
    let pts = simplify(drawing.pts, 7);
    drawing = null;
    if (totalLen(pts) < 60) return; // too short to be a field — treat as a stray click
    if (pts[pts.length - 1].x < pts[0].x) pts.reverse(); // drawn right-to-left: flip so text isn't upside down
    createTrail(toPathD(relax(pts)));
  };
  svg.addEventListener('pointerup', endStroke);
  svg.addEventListener('pointercancel', endStroke);

  /* ---------- trail = one curved text field ---------- */

  function createTrail(d) {
    const id = 'trail' + (++uid);
    const g = make('g', { class: 'trail' });
    const path = make('path', { id, d, class: 'guide' });
    const text = make('text', { class: 'txt' });
    const tp = make('textPath', { href: '#' + id });
    text.appendChild(tp);
    const ph = make('text', { class: 'ph' });
    const phTp = make('textPath', { href: '#' + id, startOffset: '10' });
    phTp.textContent = 'write here';
    ph.appendChild(phTp);
    const hit = make('path', { d, class: 'hit' });
    const caret = make('line', { class: 'caret', visibility: 'hidden' });
    g.append(path, text, ph, hit, caret);
    svg.appendChild(g);

    const trail = { g, path, tp, ph, caret, text: '', len: path.getTotalLength() };
    hit.addEventListener('pointerdown', e => {
      e.stopPropagation();
      e.preventDefault();
      focusTrail(trail, charIndexAt(trail, arcOffsetAt(trail, e.clientX, e.clientY)));
    });
    trails.push(trail);
    focusTrail(trail, 0);
  }

  function focusTrail(trail, caretIndex) {
    if (active && active !== trail) active.g.classList.remove('focused');
    active = trail;
    trail.g.classList.add('focused');
    kbd.value = trail.text;
    kbd.focus({ preventScroll: true });
    kbd.setSelectionRange(caretIndex, caretIndex);
    render(trail);
  }

  function blurActive() {
    if (!active) return;
    active.g.classList.remove('focused');
    active.caret.setAttribute('visibility', 'hidden');
    active = null;
    kbd.blur();
  }

  function removeTrail(trail) {
    trail.g.remove();
    trails = trails.filter(t => t !== trail);
    if (active === trail) { active = null; kbd.blur(); }
  }

  /* ---------- rendering ---------- */

  function render(trail) {
    trail.tp.textContent = trail.text;
    trail.ph.style.display = trail.text ? 'none' : '';
    trail.g.classList.toggle('full', widthOf(trail.text) > trail.len);
    renderCaret(trail);
  }

  function renderCaret(trail) {
    if (trail !== active) return;
    const idx = kbd.selectionStart ?? trail.text.length;
    const off = Math.min(widthOf(trail.text.slice(0, idx)), trail.len);
    const p = trail.path.getPointAtLength(off);
    // tangent direction at the caret
    let dx, dy;
    if (off + 1 <= trail.len) {
      const q = trail.path.getPointAtLength(off + 1);
      dx = q.x - p.x; dy = q.y - p.y;
    } else {
      const q = trail.path.getPointAtLength(Math.max(off - 1, 0));
      dx = p.x - q.x; dy = p.y - q.y;
    }
    const m = Math.hypot(dx, dy) || 1;
    const nx = dy / m, ny = -dx / m; // unit normal pointing "above" the baseline
    trail.caret.setAttribute('x1', p.x - nx * FS * 0.26);
    trail.caret.setAttribute('y1', p.y - ny * FS * 0.26);
    trail.caret.setAttribute('x2', p.x + nx * FS * 0.9);
    trail.caret.setAttribute('y2', p.y + ny * FS * 0.9);
    trail.caret.setAttribute('visibility', 'visible');
  }

  /* ---------- caret placement from a click ---------- */

  function arcOffsetAt(trail, x, y) {
    let best = 0, bd = Infinity;
    for (let s = 0; s <= trail.len; s += 5) {
      const p = trail.path.getPointAtLength(s);
      const d = (p.x - x) ** 2 + (p.y - y) ** 2;
      if (d < bd) { bd = d; best = s; }
    }
    return best;
  }

  function charIndexAt(trail, off) {
    let best = 0, bd = Infinity;
    for (let i = 0; i <= trail.text.length; i++) {
      const d = Math.abs(widthOf(trail.text.slice(0, i)) - off);
      if (d < bd) { bd = d; best = i; }
    }
    return best;
  }

  /* ---------- hidden input wiring ---------- */

  kbd.addEventListener('input', () => {
    if (!active) return;
    active.text = kbd.value;
    render(active);
  });

  kbd.addEventListener('keydown', e => {
    if (!active) return;
    if (e.key === 'Escape') { blurActive(); return; }
    if (e.key === 'Backspace' && kbd.value === '') {
      e.preventDefault();
      removeTrail(active);
    }
  });

  // caret moves (arrows, home/end, click-set selection)
  document.addEventListener('selectionchange', () => {
    if (active && document.activeElement === kbd) renderCaret(active);
  });
  kbd.addEventListener('keyup', () => { if (active) renderCaret(active); });

  kbd.addEventListener('blur', () => {
    if (!active) return;
    active.g.classList.remove('focused');
    active.caret.setAttribute('visibility', 'hidden');
    active = null;
  });

  document.getElementById('clear').addEventListener('click', () => {
    blurActive();
    for (const t of trails) t.g.remove();
    trails = [];
  });
})();
</script>
